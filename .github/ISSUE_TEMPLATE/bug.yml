name: Bug report
description: Something in Prism failed or did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This repo is public, so anyone can read what you post here.**
        Before you paste anything, remove your username from file paths, your browser profile name, collection names, and reel titles, captions or transcripts.
        Never paste `instagram-cookies.txt`, anything from `browser-profiles`, or any cookie value.
  - type: input
    id: version
    attributes:
      label: Prism version
      description: Output of `prism --version`.
      placeholder: prism 1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: AI agent
      description: The one doing the curation. Skip this if the problem isn't in curation.
      placeholder: Claude Code, Codex, Gemini CLI, Cursor
  - type: input
    id: command
    attributes:
      label: Command that failed
      placeholder: prism process --limit 5
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The error message, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `prism doctor`
      description: Remove your username from the paths first.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I checked this report for personal paths, cookies, and details of my saved reels.
          required: true
