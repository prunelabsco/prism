[project]
name = "prism"
version = "1.0.0"
description = "Turn saved Instagram reels into categorized ideas, locally, with your own AI agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "websockets>=15",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
prism = "prism.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
